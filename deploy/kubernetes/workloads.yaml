apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: threatlens-api:release
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: threatlens-runtime}}]
          env:
            - {name: PRODUCTION, value: "true"}
            - {name: REPORT_DIR, value: /data/reports}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 20, periodSeconds: 20}
          volumeMounts:
            - {name: reports, mountPath: /data/reports}
            - {name: providers, mountPath: /run/secrets, readOnly: true}
      volumes:
        - {name: reports, persistentVolumeClaim: {claimName: reports}}
        - {name: providers, secret: {secretName: threatlens-providers}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: threatlens-api:release
          command: [celery, -A, app.tasks.celery, worker, --loglevel=INFO, --concurrency=2, -Q, "ingestion,operations"]
          envFrom: [{secretRef: {name: threatlens-runtime}}]
          env: [{name: REPORT_DIR, value: /data/reports}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: reports, mountPath: /data/reports}
            - {name: providers, mountPath: /run/secrets, readOnly: true}
      volumes:
        - {name: reports, persistentVolumeClaim: {claimName: reports}}
        - {name: providers, secret: {secretName: threatlens-providers}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: scheduler}
  template:
    metadata:
      labels: {app: scheduler}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: threatlens-api:release
          command: [celery, -A, app.tasks.celery, beat, --loglevel=INFO, --schedule=/tmp/celerybeat]
          envFrom: [{secretRef: {name: threatlens-runtime}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: threatlens-frontend:release
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: 3000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 3000}, periodSeconds: 30}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels: {app: dispatcher}
  template:
    metadata:
      labels: {app: dispatcher}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dispatcher
          image: threatlens-api:release
          command: [celery, -A, app.tasks.celery, worker, --loglevel=INFO, --concurrency=1, -Q, maintenance]
          envFrom: [{secretRef: {name: threatlens-runtime}}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
