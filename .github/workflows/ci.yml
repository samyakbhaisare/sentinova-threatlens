name: ThreatLens quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install --upgrade pip setuptools && pip install -r backend/requirements.txt
      - run: python scripts/bootstrap.py
      - run: docker compose up -d --wait postgres redis elasticsearch
      - run: python scripts/manage.py test --cov=app.scoring --cov=app.intelligence --cov=app.correlation --cov=app.feeds --cov-fail-under=80 -q
      - run: python -m ruff check backend/app --select E9,F63,F7,F82
      - run: python -m bandit -r backend/app -ll && python -m pip_audit --progress-spinner off
      - run: npm ci && npm run typecheck && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: docker compose build api frontend
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sentinova-threatlens-api:verify
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'
          trivyignores: .trivyignore
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sentinova-threatlens-web:verify
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'
          trivyignores: .trivyignore
          exit-code: '1'
      - run: docker compose down
        if: always()
